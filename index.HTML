<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>عالمنا الخاص 🌌</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- استدعاء مكتبة Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #070b14;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }

    .app-container {
      width: 100%;
      max-width: 100%;
      height: 100%;
      background-color: #070b14;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* --- شاشة القفل السرية (PIN Screen) --- */
    #lock-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
      text-align: center;
      background-color: #070b14;
      z-index: 100;
    }

    .lock-title {
      font-size: 24px;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 25px;
    }

    .pin-input {
      background-color: #1e293b;
      color: #38bdf8;
      border: 2px solid #334155;
      border-radius: 25px;
      padding: 12px 24px;
      font-size: 20px;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
      width: 240px;
      margin-bottom: 20px;
    }

    .pin-input:focus {
      border-color: #38bdf8;
    }

    .unlock-btn {
      background-color: #f43f5e;
      color: #fff;
      border: none;
      padding: 12px 32px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
    }

    .error-msg {
      color: #f43f5e;
      font-size: 13px;
      margin-top: 15px;
      min-height: 20px;
      font-weight: 600;
    }

    /* --- شاشة الترحيب واختيار الشخصية --- */
    #welcome-screen {
      display: none;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .welcome-header {
      color: #e2e8f0;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .sub-hint {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 35px;
    }

    .couple-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 50px;
    }

    .avatar-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      border-radius: 22px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .avatar-box.selected {
      border-color: #38bdf8;
      background-color: rgba(56, 189, 248, 0.12);
      transform: translateY(-4px);
    }

    .couple-image {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #f43f5e;
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
    }

    .name-label {
      color: #cbd5e1;
      font-size: 16px;
      font-weight: 600;
      margin-top: 10px;
    }

    .heart-icon {
      font-size: 40px;
      animation: heartbeat 1.2s infinite ease-in-out;
      user-select: none;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    .start-button {
      background-color: #f43f5e;
      color: #ffffff;
      border: none;
      padding: 15px 38px;
      border-radius: 30px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(244, 63, 94, 0.45);
    }

    /* --- شاشة المحادثة الحية --- */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #0f172a;
      padding: 14px 18px;
      border-bottom: 1px solid #1e293b;
      z-index: 10;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      padding: 4px;
      color: #fff;
    }

    .header-center {
      text-align: center;
    }

    .chat-title {
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
    }

    .chat-status {
      color: #38bdf8;
      font-size: 12px;
    }

    .small-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #f43f5e;
    }

    .messages-list {
      flex: 1;
      padding: 25px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .meteor-wrapper {
      max-width: 80%;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .my-align {
      align-self: flex-start;
    }

    .her-align {
      align-self: flex-end;
    }

    .meteor-new-me {
      animation: fallFromLeft 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .meteor-new-her {
      animation: fallFromRight 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fallFromLeft {
      0% { opacity: 0; transform: translate(-180px, -250px) scale(0.5); }
      100% { opacity: 1; transform: translate(0, 0) scale(1); }
    }

    @keyframes fallFromRight {
      0% { opacity: 0; transform: translate(180px, -250px) scale(0.5); }
      100% { opacity: 1; transform: translate(0, 0) scale(1); }
    }

    .meteor-tail {
      position: absolute;
      width: 90px;
      height: 18px;
      border-radius: 10px;
      top: -12px;
      pointer-events: none;
      opacity: 0;
    }

    .meteor-new-me .meteor-tail {
      left: -20px;
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.6), transparent);
      transform: rotate(35deg);
      animation: tailFade 0.9s ease-out forwards;
    }

    .meteor-new-her .meteor-tail {
      right: -20px;
      background: linear-gradient(-90deg, rgba(244, 114, 182, 0.6), transparent);
      transform: rotate(-35deg);
      animation: tailFade 0.9s ease-out forwards;
    }

    @keyframes tailFade {
      0%, 60% { opacity: 1; }
      100% { opacity: 0; }
    }

    .meteor-body {
      padding: 12px 16px;
      border-radius: 22px;
      position: relative;
      overflow: hidden;
      word-wrap: break-word;
    }

    .my-meteor-body {
      background-color: #1e3a8a;
      border-bottom-right-radius: 4px;
      border: 1.5px solid #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.45);
    }

    .her-meteor-body {
      background-color: #3b0764;
      border-bottom-left-radius: 4px;
      border: 1.5px solid #f472b6;
      box-shadow: 0 0 12px rgba(244, 114, 182, 0.45);
    }

    .meteor-head-glow {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      bottom: 4px;
      opacity: 0.85;
    }

    .my-head {
      right: 4px;
      background-color: #bae6fd;
      box-shadow: 0 0 8px #bae6fd;
    }

    .her-head {
      left: 4px;
      background-color: #fbcfe8;
      box-shadow: 0 0 8px #fbcfe8;
    }

    .msg-text {
      color: #ffffff;
      font-size: 16px;
      line-height: 1.5;
      text-align: right;
    }

    .msg-time {
      color: #94a3b8;
      font-size: 11px;
      margin-top: 6px;
      display: block;
      text-align: left;
    }

    .input-row {
      display: flex;
      padding: 12px;
      background-color: #0f172a;
      align-items: center;
      border-top: 1px solid #1e293b;
      gap: 10px;
    }

    .text-input {
      flex: 1;
      background-color: #1e293b;
      color: #ffffff;
      border: 1px solid #334155;
      border-radius: 25px;
      padding: 10px 18px;
      font-size: 15px;
      outline: none;
      text-align: right;
    }

    .text-input:focus {
      border-color: #38bdf8;
    }

    .send-btn {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 22px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    /* إخفاء شارة نتلايفاي وأي زر عائم خارجي نهائياً */
    .netlify-badge, a[href*="netlify"], div[style*="position: fixed"][style*="bottom"] {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- شاشة قفل الرمز السري -->
    <div id="lock-screen">
      <div style="font-size: 50px; margin-bottom: 15px;">🌌</div>
      <div class="lock-title">أدخل رمز الدخول السري</div>
      
      <input type="password" id="pin-input" class="pin-input" placeholder="••••••••" maxlength="10" onkeypress="handlePinKey(event)" />
      <button class="unlock-btn" onclick="checkPin()">دخول 🌠</button>
      <div id="error-msg" class="error-msg"></div>
    </div>

    <!-- شاشة الترحيب واختيار الشخصية -->
    <div id="welcome-screen">
      <h1 class="welcome-header">عالمنا الخاص 🌌</h1>
      <p class="sub-hint">اختر حسابك للدخول إلى السماء المشتركة:</p>

      <div class="couple-row">
        <div id="box-abdulrahman" class="avatar-box selected" onclick="selectUser('abdulrahman')">
          <img src="https://i.ibb.co/HMJML3S/image.jpg" alt="عبد الرحمن" class="couple-image" />
          <span class="name-label">عبد الرحمن</span>
        </div>

        <div class="heart-icon">❤️</div>

        <div id="box-nadia" class="avatar-box" onclick="selectUser('nadia')">
          <img src="https://i.ibb.co/ks1rHCvd/image.jpg" alt="ناديه" class="couple-image" />
          <span class="name-label">ناديه</span>
        </div>
      </div>

      <button id="start-btn" class="start-button" onclick="enterChat()">
        الدخول كـ عبد الرحمن 🌠
      </button>
    </div>

    <!-- شاشة المحادثة الحية -->
    <div id="chat-screen">
      <div class="chat-header">
        <button class="back-btn" onclick="goBack()">➡️</button>
        <div class="header-center">
          <div id="partner-name" class="chat-title">ناديه ✨</div>
          <div class="chat-status">متصل في سماء المحادثة 🛰️</div>
        </div>
        <img id="partner-photo" src="https://i.ibb.co/ks1rHCvd/image.jpg" alt="الشريك" class="small-avatar" />
      </div>

      <div id="messages-list" class="messages-list"></div>

      <div class="input-row">
        <input
          type="text"
          id="msg-input"
          class="text-input"
          placeholder="أرسل شهاباً..."
          onkeypress="handleKeyPress(event)"
        />
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
      </div>
    </div>
  </div>

  <script>
    // إعدادات قاعدة البيانات Firebase
    const firebaseConfig = {
      databaseURL: "https://abude12-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = 'abdulrahman';
    const photos = {
      abdulrahman: 'https://i.ibb.co/HMJML3S/image.jpg',
      nadia: 'https://i.ibb.co/ks1rHCvd/image.jpg'
    };

    let messages = [];
    let lastMessageKey = null;

    // التحقق من الرمز السري (30092026)
    function checkPin() {
      const pinInput = document.getElementById('pin-input');
      const pin = pinInput.value.trim();
      const errorDiv = document.getElementById('error-msg');

      if (pin === '30092026') {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('welcome-screen').style.display = 'flex';
      } else {
        pinInput.value = ''; // مسح الحقل فوراً عند الخطأ
        errorDiv.innerText = 'الرجاء المحاولة';
      }
    }

    function handlePinKey(e) {
      if (e.key === 'Enter') {
        checkPin();
      }
    }

    function selectUser(user) {
      currentUser = user;
      document.getElementById('box-abdulrahman').classList.toggle('selected', user === 'abdulrahman');
      document.getElementById('box-nadia').classList.toggle('selected', user === 'nadia');
      
      const nameText = user === 'abdulrahman' ? 'عبد الرحمن' : 'ناديه';
      document.getElementById('start-btn').innerText = `الدخول كـ ${nameText} 🌠`;
    }

    function enterChat() {
      document.getElementById('welcome-screen').style.display = 'none';
      document.getElementById('chat-screen').style.display = 'flex';

      const partner = currentUser === 'abdulrahman' ? 'nadia' : 'abdulrahman';
      document.getElementById('partner-name').innerText = partner === 'nadia' ? 'ناديه ✨' : 'عبد الرحمن ✨';
      document.getElementById('partner-photo').src = photos[partner];
      document.getElementById('msg-input').placeholder = `أرسل شهاباً إلى ${partner === 'nadia' ? 'ناديه' : 'عبد الرحمن'}...`;

      listenToMessages();
    }

    function goBack() {
      document.getElementById('chat-screen').style.display = 'none';
      document.getElementById('welcome-screen').style.display = 'flex';
    }

    function listenToMessages() {
      const messagesRef = db.ref('messages');
      messagesRef.on('value', (snapshot) => {
        const data = snapshot.val();
        messages = [];
        if (data) {
          Object.keys(data).forEach(key => {
            messages.push({ id: key, ...data[key] });
          });
        }
        renderMessages();
      });
    }

    function renderMessages() {
      const list = document.getElementById('messages-list');
      list.innerHTML = '';

      messages.forEach(msg => {
        const isMe = msg.sender === currentUser;
        const wrapper = document.createElement('div');
        
        let classes = `meteor-wrapper ${isMe ? 'my-align' : 'her-align'}`;
        if (msg.id === lastMessageKey) {
          classes += isMe ? ' meteor-new-me' : ' meteor-new-her';
        }
        wrapper.className = classes;

        wrapper.innerHTML = `
          <div class="meteor-tail"></div>
          <div class="meteor-body ${isMe ? 'my-meteor-body' : 'her-meteor-body'}">
            <div class="meteor-head-glow ${isMe ? 'my-head' : 'her-head'}"></div>
            <div class="msg-text">${escapeHtml(msg.text)}</div>
            <span class="msg-time">${msg.time}</span>
          </div>
        `;

        list.appendChild(wrapper);
      });

      list.scrollTop = list.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      const now = new Date();
      const timeString = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

      const newMessageRef = db.ref('messages').push();
      lastMessageKey = newMessageRef.key;

      newMessageRef.set({
        text: text,
        sender: currentUser,
        time: timeString
      });

      input.value = '';
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
